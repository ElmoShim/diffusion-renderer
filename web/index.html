<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>G-Buffer Viewer</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; background: #1a1a1a; color: #eee; font-family: system-ui, sans-serif; overflow: hidden; }
#grid { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; width: 100vw; height: 100vh; gap: 2px; background: #333; }
.panel { position: relative; background: #000; overflow: hidden; }
.panel-label { position: absolute; top: 8px; left: 10px; font-size: 13px; font-weight: 600; color: #fff; background: rgba(0,0,0,0.6); padding: 2px 8px; border-radius: 3px; z-index: 10; pointer-events: none; }
#loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #1a1a1a; z-index: 100; font-size: 16px; }
#loading.hidden { display: none; }
</style>
</head>
<body>
<div id="loading">Loading scene...</div>
<div id="grid">
  <div class="panel" id="panel-basecolor"><span class="panel-label">Basecolor</span></div>
  <div class="panel" id="panel-normal"><span class="panel-label">Normal</span></div>
  <div class="panel" id="panel-depth"><span class="panel-label">Depth</span></div>
  <div class="panel" id="panel-roughness"><span class="panel-label">Roughness</span></div>
</div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
