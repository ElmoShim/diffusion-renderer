

# Cosmos Transfer1 Diffusion Renderer — Forward
checkpoint_dir: './checkpoints'
model_checkpoint: 'Diffusion_Renderer_Forward_Cosmos_7B/model.pt'
tokenizer_dir: 'Cosmos-Tokenize1-CV8x8x8-720p'

inference_res: [ 704, 1280 ]
inference_n_frames: 57
inference_n_steps: 15
guidance: 0.0

condition_keys:
  - basecolor
  - normal
  - metallic
  - roughness
  - depth
  - env_ldr
  - env_log
  - env_nrm

condition_drop_rate: 0.05
append_condition_mask: true
env_resolution: [ 704, 1280 ]

seed: 1000

# Legacy keys kept for render_forward.py compat
model_pipeline:
  env_resolution: [ 704, 1280 ]

envlight:
  - "examples/hdri/sunny_vondelpark_1k.hdr"
  - "examples/hdri/pink_sunrise_1k.hdr"

save_video: true
save_video_fps: 24
save_image: true
